<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
  <div class="promo-container">
    <header class="flash-sale-banner">
      <p class="banner-subtitle">FLASH SALE</p>
      <h1 class="banner-title">Giảm Giá Sốc Cuối Tuần</h1>
      <p class="banner-note">Chỉ áp dụng đến hết Chủ Nhật — Số lượng có hạn!</p>
    </header>

    <div class="product-card">
      <div class="product-image-container">
        <span class="discount">-30%</span>
        <img
          src="headphone.jpg"alt="Tai Nghe Bluetooth Chống Ồn Cao Cấp Version 20"class="product-image">
      </div>

      <div class="product-information">
        <h2 class="product-title">Tai Nghe Bluetooth Chống Ồn Cao Cấp Version 20</h2>

        <div class="product-price-box">
          <span class="current-price">699.000đ</span>
          <span class="original-price">999.000đ</span>
        </div>

        <button type="button" class="cart-button">Thêm Vào Giỏ</button>
      </div>
    </div>
  </div>
</body>
</html>
